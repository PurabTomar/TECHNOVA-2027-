<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore events, competitive coding arenas, and tournaments at TECHNOVA 2027.">
  <title>Events • TECHNOVA 2027</title>
  <link rel="icon" type="image/svg+xml" href="assets/sati-logo.svg">

  <!-- Theme Stylesheets -->
  <script src="js/motion-boot.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  <!-- Theme-Neutral Background System -->
  <div class="bg-pattern" aria-hidden="true">
    <div class="bg-layer-1"></div>
    <div class="bg-layer-2"></div>
  </div>

  <!-- Shared Navbar Injected via js/layout.js -->
  <div id="navbar-mount"></div>

  <!-- Main Content -->
  <main id="main-content" class="site-main">
    <div class="container">
      <!-- Page Header -->
      <header class="page-header">
        <span class="page-pretitle" data-theme-copy="eventsPretitle">Explore Arenas</span>
        <h1 class="page-title" data-theme-copy="eventsTitle">Festival Events</h1>
        <p class="page-description" data-theme-copy="eventsSubtitle">
          Premier tournaments, algorithmic coding battles, and stage performances.
        </p>
      </header>

      <!-- Combinable Filters & Discovery Toolbar -->
      <section class="filter-toolbar" aria-label="Event Filtering and Discovery Controls">
        <!-- Debounced Search Box -->
        <div class="search-bar-row">
          <div class="search-input-wrap">
            <span class="search-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input 
              type="search" 
              id="eventSearchInput" 
              class="search-input" 
              placeholder="Search by event title, description, venue, track..." 
              aria-label="Search events by title, description, venue, or category"
              autocomplete="off"
              spellcheck="false"
            >
            <kbd class="search-kbd" title="Press / anywhere to focus search">/</kbd>
            <button type="button" class="btn-clear-search d-none" id="clearSearchBtn" aria-label="Clear search query">✕</button>
          </div>
        </div>

        <!-- Primary Filter Chips Row (Category & Day) -->
        <div class="filter-row">
          <!-- Category Filter Buttons -->
          <div class="filter-group" role="group" aria-label="Filter by Category">
            <span class="filter-label">Category:</span>
            <button type="button" class="filter-pill active" data-filter-cat="All">All Categories</button>
            <button type="button" class="filter-pill" data-filter-cat="Technical">Technical</button>
            <button type="button" class="filter-pill" data-filter-cat="Cultural">Cultural</button>
            <button type="button" class="filter-pill" data-filter-cat="Gaming">Gaming</button>
          </div>

          <!-- Day Filter Buttons -->
          <div class="filter-group" role="group" aria-label="Filter by Day">
            <span class="filter-label">Day:</span>
            <button type="button" class="filter-pill active" data-filter-day="All">All Days</button>
            <button type="button" class="filter-pill" data-filter-day="2027-02-12">Day 1 (12 Feb)</button>
            <button type="button" class="filter-pill" data-filter-day="2027-02-13">Day 2 (13 Feb)</button>
          </div>
        </div>

        <!-- Secondary Controls Row (Venue, Time of Day, Saved Only, Sort) -->
        <div class="filter-controls-row">
          <!-- Venue Filter Dropdown -->
          <div class="filter-control-item">
            <label for="venueFilterSelect" class="control-label">Venue:</label>
            <div class="filter-select-wrap">
              <select id="venueFilterSelect" class="filter-select" aria-label="Filter events by venue">
                <option value="All">All Venues</option>
              </select>
            </div>
          </div>

          <!-- Time of Day Dropdown -->
          <div class="filter-control-item">
            <label for="todFilterSelect" class="control-label">Time of Day:</label>
            <div class="filter-select-wrap">
              <select id="todFilterSelect" class="filter-select" aria-label="Filter events by time of day">
                <option value="All">All Times</option>
                <option value="morning">Morning (&lt; 12:00)</option>
                <option value="afternoon">Afternoon (12:00 – 17:00)</option>
                <option value="evening">Evening (&gt; 17:00)</option>
              </select>
            </div>
          </div>

          <!-- Saved Only Toggle Button -->
          <div class="filter-control-item">
            <span class="control-label">Bookmarks:</span>
            <button type="button" class="filter-pill filter-saved-pill" id="savedFilterBtn" aria-pressed="false" aria-label="Show only bookmarked events">
              <span aria-hidden="true">🔖</span>
              <span>Saved Only</span>
              <span class="saved-count-pill" id="savedCountBadge">0</span>
            </button>
          </div>

          <!-- Sort Select -->
          <div class="filter-control-item filter-control-sort">
            <label for="sortSelect" class="control-label">Sort By:</label>
            <div class="filter-select-wrap">
              <select id="sortSelect" class="filter-select" aria-label="Sort events list">
                <option value="time">Time (Default)</option>
                <option value="title">Title (A – Z)</option>
                <option value="category">Category Track</option>
                <option value="duration">Duration (Shortest)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Active Filter Pills Bar (Shown when any filter is active) -->
        <div class="active-pills-row d-none" id="activePillsRow" aria-label="Active filters">
          <span class="active-pills-label">Active Filters:</span>
          <div class="active-pills-list" id="activePillsList">
            <!-- Populated dynamically with remove buttons -->
          </div>
          <button type="button" class="btn-clear-all" id="clearAllFiltersBtn" aria-label="Clear all active filters">
            <span>↺ Clear All</span>
          </button>
        </div>

        <!-- Filter Status & Quick Helper Note -->
        <div class="filter-status-row">
          <span class="event-count-badge" id="eventCountDisplay" aria-live="polite">Showing 12 of 12 events</span>
          <div class="filter-meta-note">
            <span aria-hidden="true">💡</span>
            <span>Press <kbd class="inline-kbd">/</kbd> to search anytime</span>
          </div>
        </div>
      </section>

      <!-- Events Grid Container -->
      <section class="events-grid" id="eventsGrid" aria-label="Festival Events List">
        <!-- Rendered dynamically by js/events.js via js/card.js -->
      </section>
    </div>
  </main>

  <!-- Shared Footer Injected via js/layout.js -->
  <div id="footer-mount"></div>

  <!-- Standard Scripts (Order Preserved: theme -> data -> card -> layout -> events) -->
  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
  <script src="js/card.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
